<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="홈">
      <span class="logo-mark" aria-hidden="true">IM</span>
      <span class="logo-text">{{ site.title }}</span>
    </a>
    <nav class="nav" aria-label="주제">
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span>
      </button>
      <ul class="nav-list" id="nav-menu">
        {% for topic in site.data.topics %}
          <li>
            <a href="{{ topic.slug | prepend: '/' | append: '/' | relative_url }}">{{ topic.name }}</a>
          </li>
        {% endfor %}
        <li>
          <a href="{{ '/search/' | relative_url }}">검색</a>
        </li>
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.2 6.2l1.4 1.4M16.4 16.4l1.4 1.4M6.2 17.8l1.4-1.4M16.4 7.6l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 14.3A8.5 8.5 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/>
      </svg>
    </button>
  </div>
</header>
