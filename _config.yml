title: Inyoung Media
tagline: 검은사막 메모 허브
description: >-
  검은사막 장비·개량·세팅을 주제별로 정리하는 미디어 허브입니다.
author: Inyoung Lee
lang: ko
locale: ko_KR
timezone: Asia/Seoul
url: https://www.inyounglee.kr
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
sass:
  style: compressed

# 글 목록 페이지당 개수 (변경 가능)
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title: ":title · :num페이지"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .github
  - auto
  - docs
  - start.bat

kramdown:
  input: GFM
  hard_wrap: false

logo: /assets/favicon.svg
social:
  name: Inyoung Lee
  links:
    - https://github.com/inyounglee

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
